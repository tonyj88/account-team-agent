# Field catalog for the Account Plan template (template dated Sep 2026).
#
# The template .docx itself is Confidential and is NOT in this repo; keep it at
# data/templates/account_plan.docx (gitignored). This file records only its structure so
# extraction, rendering and approval can be driven from config.
#
# Per field:
#   key       stable id used in AccountFact.field_key / row tables
#   label     the label as printed in the template
#   source    where the value comes from:
#               crm        Salesforce via C1 MCP snapshot (Phase G0/G1; exports are the fallback)
#               zoominfo   ZoomInfo contact/company export (Phase G1)
#               copilot_draft  cell read from a Copilot-filled copy of this template
#                          (Phase G2); never cited, ALWAYS needs approval, any field
#               note       extracted from meeting notes, verbatim-quote evidence required
#               derived    computed from other fields/rows
#               human      only a person can supply it
#               llm_draft  LLM-proposed judgement; ALWAYS needs human approval
#               system     maintained by the bot itself
#   approval  default approval state for values from this field:
#               auto            accepted unless low-confidence / conflicting / stale
#               needs_approval  always needs a human to approve
#   alt_sources  other sources that can also supply the field
#   mvp       true = filled in the first usable version (Tony, 2026-09-28)
#
# Rows (`kind: rows`) are repeating tables; `columns` follow the same fields.

refresh_policy:
  high_value_arr_threshold_usd: 150000
  high_value_cadence: quarterly
  default_cadence: semiannual
  trigger_event_update_within_business_days: 5

header:
  mvp: true
  fields:
    - {key: header.executive_sponsor, label: "Executive Sponsor", source: note, approval: needs_approval}
    - {key: header.status_rag, label: "Status (Red, Green or Amber)", source: llm_draft, approval: needs_approval}

sections:
  - id: 1
    key: snapshot
    title: "Account Snapshot"
    mvp: true
    fields:
      - {key: snapshot.account, label: "Account", source: system, approval: auto}
      - {key: snapshot.account_owner, label: "Account Owner", source: crm, approval: auto}
      - {key: snapshot.plan_date, label: "Plan Date", source: system, approval: auto}
      - {key: snapshot.se_owner, label: "SE Owner", source: crm, approval: auto}
      - {key: snapshot.sdr_owner, label: "SDR Owner", source: crm, approval: auto}
      - {key: snapshot.csm_renewal_tam_owners, label: "CSM/Renewal/TAM Owner(s)", source: crm, approval: auto}
      - {key: snapshot.segment_geo, label: "Segment / Geo", source: crm, alt_sources: [zoominfo], approval: auto}
      - {key: snapshot.industry, label: "Industry", source: crm, alt_sources: [zoominfo], approval: auto}
      - {key: snapshot.fiscal_year, label: "Fiscal Year", source: crm, approval: auto}
      - {key: snapshot.current_arr, label: "Current ARR", source: derived, approval: needs_approval, derived_from: [crm.contract.total_value, crm.contract.term_months], note: "Salesforce has no ARR field; Amount is TCV. Annualize active contract(s) in code; needs approval until leadership confirms the ARR definition."}
      - {key: snapshot.renewal_dates, label: "Renewal Date(s)", source: crm, approval: auto, note: "Active contract end date; cross-check open renewal opportunity; mismatch => needs_approval."}
      - {key: snapshot.health_rag, label: "Health (R/A/G)", source: llm_draft, approval: needs_approval}
      - {key: snapshot.target_arr_fy, label: "Target ARR (FY)", source: human, approval: auto}
      - {key: snapshot.growth_gap_usd, label: "Growth $ Gap", source: derived, approval: auto, derived_from: [snapshot.target_arr_fy, snapshot.current_arr]}
      - {key: snapshot.churn_risk_usd, label: "Churn Risk $", source: human, approval: needs_approval}
      - {key: snapshot.last_reviewed, label: "Last Reviewed", source: system, approval: auto}
      - {key: snapshot.reviewed_with, label: "Reviewed With", source: human, approval: auto}
      - {key: snapshot.next_review, label: "Next Review", source: derived, approval: auto, derived_from: [snapshot.last_reviewed, snapshot.current_arr]}

  - id: 2
    key: strategy
    title: "Account Strategy"
    mvp: false
    grid:
      columns: [today, in_12_months, in_3_years]
      rows:
        - {key: strategy.lifetime_spend_arr, label: "Total lifetime spend/ARR", source: {today: crm, in_12_months: human, in_3_years: human}}
        - {key: strategy.products_modules, label: "Products / modules", source: {today: crm, in_12_months: human, in_3_years: human}}
        - {key: strategy.business_units_geos, label: "Business units / geos", source: {today: note, in_12_months: human, in_3_years: human}}
        - {key: strategy.highest_relationship, label: "Highest relationship", source: {today: derived, in_12_months: human, in_3_years: human}}
    fields:
      - {key: strategy.growth_thesis, label: "Our growth thesis", source: llm_draft, approval: needs_approval}
      - {key: strategy.must_win_plays, label: "Must-win plays this year", source: llm_draft, approval: needs_approval}

  - id: 3
    key: today
    title: "Where We Are Today"
    mvp: false
    fields:
      - {key: today.what_they_buy, label: "What they buy from us today", source: crm, alt_sources: [note], approval: auto, note: "Salesforce Asset + Contract + OpportunityLineItem for products/licences/seats; Salesforce Case for support tickets/ERs (if customer cases live there — verify); notes add adoption signals"}
      - {key: today.their_business, label: "What we know about their business", source: note, approval: auto}
      - {key: today.other_vendors, label: "Who else do they buy from?", source: note, approval: auto}
      - {key: today.why_bought_us, label: "Why did they buy us originally, and is that reason still true?", source: llm_draft, approval: needs_approval}

  - id: 4
    key: meddpicc
    title: "Qualification — MEDDPICC"
    mvp: true
    note: "Each element = evidence text (verbatim-quote backed) + R/A/G status. Evidence is note-sourced; R/A/G is always a draft for approval."
    elements:
      - {key: meddpicc.metrics, label: "Metrics"}
      - {key: meddpicc.economic_buyer, label: "Economic Buyer"}
      - {key: meddpicc.decision_criteria, label: "Decision Criteria"}
      - {key: meddpicc.decision_process, label: "Decision Process"}
      - {key: meddpicc.paper_process, label: "Paper Process"}
      - {key: meddpicc.identified_pain, label: "Identified Pain"}
      - {key: meddpicc.champion, label: "Champion"}
      - {key: meddpicc.competition, label: "Competition"}
    element_fields:
      evidence: {source: note, approval: auto}
      status_rag: {source: llm_draft, approval: needs_approval}

  - id: 5
    key: stakeholders
    title: "Stakeholder Map"
    mvp: true
    kind: rows
    columns:
      - {key: name, label: "Name", source: note, approval: auto}
      - {key: role_title, label: "Role / Title", source: note, alt_sources: [zoominfo], approval: auto}
      - {key: meddpicc_role, label: "MEDDPICC role", source: note, approval: needs_approval, values: [EB, Champion, Coach, Tech, Influencer, Blocker]}
      - {key: position, label: "Position", source: llm_draft, approval: needs_approval, values: [Advocate, Supporter, Neutral, Detractor]}
      - {key: coverage, label: "Our coverage — who owns the relationship & next touch", source: note, approval: auto}

  - id: 6
    key: org_chart
    title: "Org Chart & Coverage Map"
    mvp: false
    kind: rows
    note: "Tier 1 = economic buyer & exec sponsor; Tier 2 = decision makers & budget owners; Tier 3 = influencers, technical & users. Blank or '?' in Tier 1/2 is an open risk."
    columns:
      - {key: tier, label: "Tier", source: derived, alt_sources: [zoominfo], approval: needs_approval, values: [1, 2, 3]}
      - {key: name_title, label: "Name / Title", source: note, alt_sources: [zoominfo], approval: auto}
      - {key: code, label: "Code", source: llm_draft, approval: needs_approval, values: [C, S, N, D, "?"]}
      - {key: owned_by, label: "Owned by", source: human, approval: auto}

  - id: 7
    key: competition
    title: "Competition"
    mvp: false
    kind: rows
    columns:
      - {key: competitor, label: "Who we are against", source: note, approval: auto}
      - {key: position_footprint, label: "Their position & footprint here", source: note, approval: auto}
      - {key: counter_position, label: "Our counter-position", source: llm_draft, approval: needs_approval}
      - {key: trap_question, label: "Trap-setting question we ask", source: llm_draft, approval: needs_approval}
      - {key: threat, label: "Threat H/M/L", source: llm_draft, approval: needs_approval, values: [H, M, L]}
    fixed_rows: ["Status quo / do nothing", "Internal build / open source"]

  - id: 8
    key: partners
    title: "Channel & Partner Influence"
    mvp: false
    kind: rows
    columns:
      - {key: partner, label: "Partner / firm", source: note, approval: auto}
      - {key: type, label: "Type", source: note, approval: auto, values: ["Reseller / VAR", "GSI / consultancy", "Cloud / tech alliance", "Competitor's partner"]}
      - {key: role_in_account, label: "Their role in this account", source: note, approval: auto}
      - {key: influence, label: "Influence on decision", source: llm_draft, approval: needs_approval, values: [H, M, L]}
      - {key: aligned, label: "Aligned to us?", source: llm_draft, approval: needs_approval, values: ["Yes", "Neutral", "Aligned to competitor", "Unknown"]}
      - {key: owner_next_touch, label: "Owner & next touch", source: note, approval: auto}

  - id: 9
    key: opportunities
    title: "Opportunity & Whitespace Plan"
    mvp: false
    kind: rows
    columns:
      - {key: opportunity, label: "Opportunity / play", source: crm, approval: auto}
      - {key: type, label: "Type", source: crm, approval: auto, values: ["Renewal", "Growth - upsell", "Growth - cross sell", "New Logo", "Whitespace"]}
      - {key: value, label: "Value", source: crm, approval: auto}
      - {key: close_qtr, label: "Close Qtr", source: crm, approval: auto}
      - {key: stage, label: "Stage", source: crm, approval: auto}
      - {key: next_action, label: "Single next action to advance", source: note, approval: auto}
      - {key: sfdc_link, label: "SFDC opp link", source: crm, approval: auto}

  - id: 10
    key: risks
    title: "Risks & Blockers"
    mvp: true
    kind: rows
    columns:
      - {key: risk, label: "Risk / blocker", source: note, alt_sources: [crm], approval: auto, note: "Salesforce escalated Cases can seed risks. commercial, technical, political, competitive, timing, or internal"}
      - {key: mitigation, label: "Mitigation", source: note, approval: auto}
      - {key: owner, label: "Owner", source: note, approval: auto}
      - {key: by_when, label: "By when", source: note, approval: auto}

  - id: 11
    key: action_plan
    title: "30 / 60 / 90-Day Action Plan"
    mvp: true
    kind: rows
    note: "Bucket by due date. Rule from the template: every Amber in Section 4 should appear in the 30-day bucket — the renderer flags any that don't."
    buckets:
      - {key: d30, label: "Next 30 days — close the biggest qualification gap"}
      - {key: d60, label: "By 60 days — advance the decision process"}
      - {key: d90, label: "By 90 days — paper process and commercial close"}
    columns:
      - {key: action, label: "Action — specific and verifiable", source: note, approval: auto}
      - {key: owner, label: "Owner", source: note, approval: auto}
      - {key: due, label: "Due", source: note, approval: auto}
      - {key: status, label: "Status", source: system, approval: auto}

  - id: 12
    key: the_ask
    title: "The Ask"
    mvp: false
    fields:
      - {key: ask.one_thing, label: "The one thing that has to be true this quarter", source: llm_draft, approval: needs_approval}
      - {key: ask.needs_from_management, label: "What I need from management / the business", source: human, approval: auto}

# From the template appendix: update the plan within 5 business days when any of these
# happen. Extraction flags them (Phase F); renewal_final_two_quarters comes from CRM dates.
trigger_events:
  - {key: champion_or_eb_change, label: "Champion or economic buyer leaves, or changes role", source: note, alt_sources: [zoominfo]}
  - {key: corporate_event, label: "Reorganisation, acquisition, divestment or funding event", source: note, alt_sources: [zoominfo]}
  - {key: financial_freeze, label: "Earnings miss, budget freeze or hiring freeze", source: note}
  - {key: competitor_beachhead, label: "Competitor lands a beachhead anywhere in the account", source: note}
  - {key: security_incident, label: "Security incident, breach or audit finding in our domain", source: note, alt_sources: [crm]}
  - {key: renewal_final_two_quarters, label: "Renewal enters its final two quarters", source: derived}
