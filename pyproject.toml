[project]
name = "account-team-bot"
version = "0.1.0"
description = "Central brain for an account team: ingests meeting notes from anywhere, answers questions about customers."
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0.36",
    "pydantic>=2.10",
    "anthropic>=0.69",
    "python-frontmatter>=1.1",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
]

# Each extra maps to a capability tier from the plan. The core install needs no
# external permissions; every extra corresponds to an access grant we may not get.
[project.optional-dependencies]
normalize = ["python-docx>=1.1", "pypdf>=5.1", "beautifulsoup4>=4.12"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "httpx>=0.28"]
crm = ["simple-salesforce>=1.12"]
graph = ["msal>=1.31", "httpx>=0.28"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.8"]

[project.scripts]
atb = "atb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atb"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
