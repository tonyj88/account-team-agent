[project]
name = "account-team-bot"
version = "0.2.0"
description = "Deterministic toolkit that reconciles, validates and renders leadership's Account Plan from evidence gathered by Claude."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
atb-tools = "atb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atb"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
